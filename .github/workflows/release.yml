  release-github:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.pat_github }}
        ref: main
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@flashsprintsolutions'

    - run: |
        test -f package.json || (echo "::error::package.json missing"; exit 1)
        jq -r .name package.json
        jq -r .version package.json
        test "$(jq -r .name package.json)" = "@flashsprintsolutions/nodejs-framework" || \
          (echo "::error::Package name must be @flashsprintsolutions/nodejs-framework"; exit 1)

    - name: Check PAT user + org membership (debug)
      run: |
        USER=$(curl -s -H "Authorization: token ${{ secrets.pat_github }}" https://api.github.com/user | jq -r .login)
        echo "PAT user: $USER"
        curl -s -o /dev/null -w "%{http_code}\n" \
          -H "Authorization: token ${{ secrets.pat_github }}" \
          https://api.github.com/orgs/flashsprintsolutions/members/$USER
        # 204 = is a member, 404 = not a member (needs adding)

#    - name: Preflight auth
#      run: npm whoami --registry=https://npm.pkg.github.com
#      env:
#        NODE_AUTH_TOKEN: ${{ secrets.pat_github }}  # classic PAT with write:packages, read:packages, repo

    - name: Configure npm auth
      run: |
        echo "@flashsprintsolutions:registry=https://npm.pkg.github.com" >> $NPM_CONFIG_USERCONFIG
        echo "//npm.pkg.github.com/:_authToken=${{ secrets.pat_github }}" >> $NPM_CONFIG_USERCONFIG
        echo "always-auth=true" >> $HOME/.npmrc
        echo "|$HOME|"

      # Optional: sanity check auth
    - name: Preflight auth
      run: npm whoami --registry=https://npm.pkg.github.com

    - name: Update package
      id: update_package
      run: |
        git config --global user.email "yog27ray@example.com"
        git config --global user.name "Yogendra Singh"
        VERSION=$(npm version ${{ github.event.inputs.increment-type }})
        #echo "\n//npm.pkg.github.com/:_authToken=${{ secrets.pat_github}}" >> .npmrc
        npm ci
        npm run build
        cd dist
        cd ..
        git checkout .npmrc
    - name: Set env
      run: echo "TAG_NAME=$(cat package.json| jq -r .version)" >> $GITHUB_OUTPUT
      id: version
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.pat_github}}
      with:
        tag_name: ${{ steps.version.outputs.TAG_NAME }}
        release_name: Release ${{ steps.version.outputs.TAG_NAME }}
        body: |
          Release v-${{ steps.version.outputs.TAG_NAME }}
        draft: false
        prerelease: false
    - name: Create Github package
      id: create_github_package
      run: |
        ls -lah
        npm publish --registry=https://npm.pkg.github.com/
      env:
        NODE_AUTH_TOKEN: ${{secrets.pat_github}}
